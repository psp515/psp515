name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v4
        with:
          path: ./docs
          node-version: 22
        env:
          # Serving from https://psp515.github.io/psp515/ (project pages),
          # not a custom domain at root — Astro needs the real subpath baked
          # into every asset/nav URL. Drop this once a custom domain is
          # wired up in front of Pages (see astro.config.mjs).
          BASE_PATH: /psp515

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
