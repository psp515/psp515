name: Refresh profile stats

# Keeps the "Stars given" badge in README.md current. GitHub exposes no
# starred-repo count in the REST user object and shields.io cannot read the
# Link header, so the number is baked into the badge and refreshed here.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count stars given
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          link=$(gh api -i "users/${OWNER}/starred?per_page=1" 2>/dev/null \
                 | tr -d '\r' | grep -i '^link:' || true)
          if echo "$link" | grep -q 'rel="last"'; then
            # per_page=1 -> last page number == total count
            n=$(echo "$link" | grep -o 'page=[0-9]*>; rel="last"' | grep -o '[0-9]*')
          else
            # single page: count it directly
            n=$(gh api "users/${OWNER}/starred?per_page=100" --jq 'length')
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "stars given: $n"

      - name: Patch README badge
        run: |
          set -euo pipefail
          sed -i -E "s#(Stars_given-)[0-9]+(-)#\1${{ steps.count.outputs.count }}\2#" README.md

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet README.md; then
            echo "no change"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh stars-given count [skip ci]"
          git push
